<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的在线音乐库</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        h1 { color: #333; }
        .song { margin-bottom: 15px; }
        .song-title { font-weight: bold; }
    </style>
</head>
<body>
    <h1>🎵 我的在线音乐库</h1>
    <p>点击下方歌曲即可播放：</p>

    <div class="song">
        <div class="song-title">第一首歌</div>
        <audio controls>
            <source src="music/song1.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
    </div>

    <div class="song">
        <div class="song-title">第二首歌</div>
        <audio controls>
            <source src="music/song2.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
    </div>
</body>
</html>
